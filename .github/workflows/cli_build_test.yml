name: CLI/TUI Build & Test
on:
  push:
    paths:
      - 'packages/**'
      - 'cw_core/**'
      - '.github/workflows/cli_build_test.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'cw_core/**'
      - '.github/workflows/cli_build_test.yml'

jobs:
  analyze-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - name: Set up pure-Dart overrides for headless builds
        shell: bash
        run: |
          # Use torch_dart_stub and cake_backup_stub for pure-Dart compilation
          # These override Flutter-dependent packages with no-op stubs
          cat > packages/cake_headless/pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            torch_dart:
              path: ../torch_dart_stub
            cake_backup:
              path: ../cake_backup_stub
          YAML
          cp packages/cake_headless/pubspec_overrides.yaml packages/cake_console/pubspec_overrides.yaml

      - name: Get headless dependencies
        run: dart pub get
        working-directory: packages/cake_headless

      - name: Analyze headless
        run: dart analyze --fatal-infos
        working-directory: packages/cake_headless

      - name: Run headless tests
        run: dart test
        working-directory: packages/cake_headless

      - name: Get console dependencies
        run: dart pub get
        working-directory: packages/cake_console

      - name: Analyze console
        run: dart analyze --fatal-infos
        working-directory: packages/cake_console

      - name: Run console tests
        run: dart test
        working-directory: packages/cake_console

      - name: Verify binary compiles
        run: dart compile exe bin/cake.dart -o cake
        working-directory: packages/cake_console
