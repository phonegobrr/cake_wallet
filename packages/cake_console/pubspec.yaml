name: cake_console
description: Unified CLI/TUI/MCP binary for Cake Wallet
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.6 <4.0.0'

executables:
  cake: cake

dependencies:
  cake_headless:
    path: ../cake_headless
  dart_lipgloss:
    git:
      url: https://github.com/phonegobrr/dart_lipgloss
      ref: main
  args: ^2.5.0
  cw_core:
    path: ../../cw_core

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1

dependency_overrides:
  torch_dart:
    path: ../torch_dart_stub
  cake_backup:
    path: ../cake_backup_stub
