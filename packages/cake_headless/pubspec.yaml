name: cake_headless
description: Pure-Dart headless application core for Cake Wallet
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  cw_core:
    path: ../../cw_core
  mobx: ^2.0.7+4
  encrypt: ^5.0.1
  hive: ^2.2.3

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1

dependency_overrides:
  torch_dart:
    path: ../torch_dart_stub
  cake_backup:
    path: ../cake_backup_stub
