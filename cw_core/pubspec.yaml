name: cw_core
description: Pure-Dart core library for Cake Wallet
version: 0.0.1
publish_to: none
homepage: https://cakewallet.com

environment:
  sdk: '>=3.0.6 <4.0.0'

dependencies:
  http: ^1.1.0
  file: ^7.0.0
  path: ^1.9.0
  mobx: ^2.0.7+4
  intl: any
  encrypt: ^5.0.1
  decimal: ^2.3.3
  cake_backup:
    git:
      url: https://github.com/cake-tech/cake_backup.git
      ref: main
      version: 1.0.0
  socks5_proxy:
    git:
      url: https://github.com/LacticWhale/socks_dart
      ref: 27ad7c2efae8d7460325c74b90f660085cbd0685
  unorm_dart: ^0.3.0
  on_chain:
    git:
      url: https://github.com/cake-tech/on_chain.git
      ref: 096865a8c6b89c260beadfec04f7e184c40a3273
  socks_socket:
    git:
      url: https://github.com/sneurlax/socks_socket
      ref: e6232c53c1595469931ababa878759a067c02e94
  torch_dart:
    path: ../scripts/torch_dart
  blockchain_utils:
    git:
      url: https://github.com/cake-tech/blockchain_utils
      ref: cake-update-v2
  sqflite_common_ffi: ^2.3.4+4
  bech32:
    git:
      url: https://github.com/cake-tech/bech32.git

dev_dependencies:
  test: ^1.25.0
  build_runner: ^2.4.15
  build_resolvers: ^2.4.4
  mobx_codegen: ^2.0.7
  hive_generator: ^2.0.1

dependency_overrides:
  watcher: ^1.1.0
